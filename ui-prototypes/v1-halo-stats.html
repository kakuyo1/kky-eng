<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 今日统计</title>
<style>
:root{
  --bg:#f6f6f8; --panel:#fff; --panel2:#fafafb; --line:#e9e9ee; --line2:#f2f2f5;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8; --ok:#2f9e6e; --ok-bg:#e6f4ee;
  --r-lg:18px;
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:flex;padding:36px 20px}

.stats{width:280px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);padding:18px 20px 16px}
.st-h{display:flex;align-items:center;font-size:14px;font-weight:650}
.st-h svg{margin-left:auto;width:15px;height:15px;color:var(--faint)}

.st-hero{margin:16px 0 4px}
.st-hero b{display:block;font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.st-hero span{font-size:11.5px;color:var(--faint)}

.st-sep{height:1px;background:var(--line2);margin:14px 0 6px}
.st-row{display:flex;align-items:center;padding:6px 0;font-size:12.5px;color:var(--muted)}
.st-row b{margin-left:auto;color:var(--text);font-weight:600;font-family:var(--mono)}
.st-row.sum{color:var(--text)}
.st-row.link{color:var(--text);cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:8px}
.st-row.link:hover{background:var(--panel2)}
.st-chev{width:13px;height:13px;color:var(--faint);margin-left:6px;flex:none}
.themebtn{position:fixed;top:14px;right:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--f);font-size:11.5px;cursor:pointer}
.themebtn:hover{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stats">
  <div class="st-h">今日统计<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg></div>

  <div class="st-hero"><b>128</b><span>今日弹词</span></div>

  <div class="st-sep"></div>
  <div class="st-row">已会<b>42</b></div>
  <div class="st-row">新词<b>15</b></div>
  <div class="st-row link">花费<b>¥0.42</b><svg class="st-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg></div>
  <div class="st-row link">历史累计<b>612 词</b><svg class="st-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg></div>
</div>
<button class="themebtn" id="tb">黑夜</button>
<script>
const tb = document.getElementById('tb');
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  tb.textContent = t === 'dark' ? '白天' : '黑夜';
}
applyTheme(location.search.includes('theme=dark') ? 'dark' : 'light');
tb.onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
</script>
</body>
</html>
