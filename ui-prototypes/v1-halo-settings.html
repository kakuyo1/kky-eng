<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 设置浮层</title>
<style>
:root{
  --bg:#f6f6f8; --panel:#fff; --panel2:#fafafb; --line:#e9e9ee; --line2:#f2f2f5;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8;
  --ink:#1a1a1f; --on:#fff;
  --r-lg:18px;
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --ink:#e9e9ee; --on:#16161a;
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:flex;padding:36px 20px}

.settings{width:360px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);padding:18px 20px;display:flex;flex-direction:column;gap:15px}
.set-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650}
.set-h svg{margin-left:auto;color:var(--faint);width:15px;height:15px}
.sg .l{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg span{flex:1;text-align:center;padding:6.5px 0;font-size:12px;color:var(--muted);cursor:default}
.seg span.on{background:var(--ink);color:var(--on);font-weight:600}

.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-family:var(--f);font-size:12.5px;text-align:left;cursor:pointer}
.dd-btn svg{margin-left:auto;width:14px;height:14px;color:var(--faint);flex:none}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh2);padding:5px;z-index:9;display:none}
.dd.open .dd-list{display:block}
.dd-item{display:flex;align-items:center;padding:7px 11px;border-radius:8px;font-size:12.5px;color:var(--text);cursor:default}
.dd-note{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:400}
.dd-item.on .dd-note{color:rgba(255,255,255,.62)}
.dd-item:hover{background:var(--panel2)}
.dd-item.on{background:var(--ink);color:var(--on);font-weight:600}
.dd-sep{height:1px;background:var(--line2);margin:5px 8px}
.input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--panel2);color:var(--text);font-family:var(--f)}
.input::placeholder{color:var(--faint)}
.kbdrow{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:12.5px}
.kbdrow kbd{margin-left:auto;font-family:var(--f);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.swgroup{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px 12px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:12.5px}
.swrow.off,.kbdrow.off{color:var(--faint);cursor:default}
.swrow.off .switch{opacity:.45}
.kbdrow.off kbd{opacity:.5}
.switch{display:block;width:34px;height:20px;border-radius:99px;background:var(--ink);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--on)}
.switch.off{background:var(--line)}
.switch.off::after{left:2px;right:auto}
html[data-theme=dark] .switch.off::after{background:var(--faint)}
.set-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line2);padding-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:var(--f);transition:.15s}
.btn.ghost{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--text)}
.btn.ink{background:var(--ink);color:var(--on)}
.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="settings">
  <div class="set-h">设置<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
  <div class="sg"><div class="l">词汇档位</div>
    <div class="dd open">
      <button class="dd-btn" type="button"><span class="dd-lab">CET-6</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="dd-list">
        <div class="dd-item"><span class="dd-name">B1–B2</span></div>
        <div class="dd-item"><span class="dd-name">C1–C2</span></div>
        <div class="dd-sep"></div>
        <div class="dd-item"><span class="dd-name">CET-4</span><span class="dd-note">Minimum requirement</span></div>
        <div class="dd-item on"><span class="dd-name">CET-6</span></div>
        <div class="dd-item"><span class="dd-name">TEM-4</span></div>
        <div class="dd-item"><span class="dd-name">TEM-8</span></div>
        <div class="dd-sep"></div>
        <div class="dd-item"><span class="dd-name">IELTS</span></div>
        <div class="dd-item"><span class="dd-name">TOEFL</span></div>
      </div>
    </div>
  </div>
  <div class="sg"><div class="l">解释语言</div><div class="seg"><span class="on">English</span><span>中文</span></div></div>
  <div class="sg"><div class="l">主题</div><div class="seg" id="themseg"><span class="on">白天</span><span>黑夜</span></div></div>
  <div class="sg"><div class="l">API</div><input class="input" placeholder="sk-********************************"></div>
  <div class="sg"><div class="l">触发通道</div>
    <div class="swgroup">
      <div class="swrow"><span>选区取词</span><span class="switch"></span></div>
      <div class="swrow off"><span>OCR</span><span class="switch off"></span></div>
      <div class="swrow off"><span>自动扫描</span><span class="switch off"></span></div>
    </div>
  </div>
  <div class="sg"><div class="l">全局热键</div><div class="kbdrow off">开关自动扫描<kbd>F8</kbd></div></div>
  <div class="set-actions"><button class="btn ghost">恢复默认</button><button class="btn ink">保存</button></div>
</div>
<script>
const dd = document.querySelector('.dd'), lab = dd.querySelector('.dd-lab');
dd.querySelector('.dd-btn').onclick = () => dd.classList.toggle('open');
dd.querySelectorAll('.dd-item').forEach(it => it.onclick = () => {
  dd.querySelector('.dd-item.on').classList.remove('on');
  it.classList.add('on');
  lab.textContent = it.querySelector('.dd-name').textContent;
  dd.classList.remove('open');
});
document.addEventListener('click', e => { if (!dd.contains(e.target)) dd.classList.remove('open'); });

const seg = document.getElementById('themseg'), segs = [...seg.children];
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  segs.forEach((s, i) => s.classList.toggle('on', (i === 0) === (t !== 'dark')));
}
applyTheme(location.search.includes('theme=dark') ? 'dark' : 'light');
segs.forEach((s, i) => s.onclick = () => applyTheme(i === 0 ? 'light' : 'dark'));
</script>
</body>
</html>
