<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 解释浮层</title>
<style>
:root{
  --bg:#e9ebef; --panel:#fff; --panel2:#f1f3f7; --line:#d6dae1; --line2:#e6e9ee;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8;
  --ok:#2f9e6e; --ok-bg:#e6f4ee; --ok-text:#1d7a52; --ink:#1a1a1f; --on:#fff;
  --bubble-bg:rgba(255,255,255,.86); --bubble-bd:rgba(255,255,255,.95); --bubble-sh:0 14px 44px -10px rgba(20,20,26,.26),inset 0 1px 0 #fff;
  --r-lg:18px;
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --ok:#45c08a; --ok-bg:#1a3527; --ok-text:#6fd6a5; --ink:#e9e9ee; --on:#16161a;
  --bubble-bg:rgba(30,30,35,.82); --bubble-bd:rgba(255,255,255,.09);
  --bubble-sh:0 16px 48px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:grid;place-items:center}

.bubble{position:relative;width:270px;background:var(--bubble-bg);border:1px solid var(--bubble-bd);border-radius:var(--r-lg);box-shadow:var(--bubble-sh);padding:14px 16px 12px;z-index:3;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.bub-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bub-close{margin-left:auto;width:15px;height:15px;color:var(--faint)}
.tag{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok-text);font-weight:600}
.tag.known{background:var(--panel2);color:var(--muted);font-weight:600}
.tag.outline{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;padding:1px 7px}
.bub-word{font-size:20px;font-weight:650;letter-spacing:-.01em}
.ipa{margin-left:7px;font-size:12.5px;font-weight:400;color:var(--faint)}
.bub-def{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:6px}
/* The word's origin, set off from the meaning above it: the rule and the label are what keep the
   reader from reading one long definition (UI.md 4.3). Nothing is drawn when there is no origin. */
.bub-etym{margin-top:6px;border-top:1px solid var(--line2);padding-top:5px}
.bub-etym-label{font-size:11px;font-weight:700;color:var(--muted)}
.bub-etym-text{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}
.bub-actions{display:flex;gap:8px;max-height:0;opacity:0;overflow:hidden;transition:.22s ease}
.bubble:hover .bub-actions{max-height:44px;opacity:1;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.bub-meta{font-size:11px;color:var(--faint);margin-top:9px;display:flex;align-items:center;gap:6px}
.bub-meta svg{width:12px;height:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;font-family:var(--f);transition:.15s}
.btn.known{background:var(--panel2);color:var(--text);border-color:var(--line)}
.btn.again{background:var(--ink);color:var(--on)}
.btn:active{transform:scale(.97)}
.themebtn{position:fixed;top:14px;right:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--f);font-size:11.5px;cursor:pointer}
.themebtn:hover{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bubble">
  <div class="bub-top"><span class="tag" data-l="new"></span><svg class="bub-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
  <div class="bub-word">serendipity<span class="ipa">/ˌserənˈdɪpəti/</span></div>
  <div class="bub-def" data-l="def"></div>
  <div class="bub-etym">
    <div class="bub-etym-label" data-l="etymLabel"></div>
    <div class="bub-etym-text" data-l="etym"></div>
  </div>
  <div class="bub-actions"><button class="btn known" data-l="known"></button><button class="btn again" data-l="new"></button></div>
  <div class="bub-meta" data-l="meta"></div>
</div>
<button class="themebtn" id="tb"></button>
<script>
/// The reader-facing strings, one column per language, taken from i18n/lens_*.ts so the
/// prototype and the application say the same thing. `def` is the explanation itself -- sample
/// content, not a string the application owns, and it follows the explanation-language setting.
/// `etymLabel` is a string the application owns; `etym` is more of the same sample content, and it
/// is drawn only when the etymology setting is on.
const L = {
  en: { new: "New", known: "Known", meta: "Disappears in 5s",
        def: "the occurrence of events by chance in a happy or beneficial way",
        etymLabel: "Etymology",
        etym: "Coined in 1754 from Horace Walpole's tale of the three princes of Serendip.",
        themeDark: "Dark", themeLight: "Light" },
  zh: { new: "新词", known: "已会", meta: "5 秒后自动消失",
        def: "偶然遇到美好事物的运气；意外的幸运发现。",
        etymLabel: "词源",
        etym: "1754 年由霍勒斯·沃波尔在《塞伦迪普三王子》中首创。",
        themeDark: "黑夜", themeLight: "白天" },
  ja: { new: "初見", known: "覚えた", meta: "5 秒後に消えます",
        def: "思いがけず素敵なものに出会う幸運。",
        etymLabel: "語源",
        etym: "1754 年、ホレス・ウォルポールの『セレンディップの三人の王子』で作られた語。",
        themeDark: "ダーク", themeLight: "ライト" },
  es: { new: "Nueva", known: "Conocida", meta: "Desaparece en 5 s",
        def: "el hallazgo afortunado de algo bueno por casualidad.",
        etymLabel: "Etimología",
        etym: "Acuñada en 1754 a partir del cuento de los tres príncipes de Serendip, de Horace Walpole.",
        themeDark: "Oscuro", themeLight: "Claro" }
};
const asked = (new URLSearchParams(location.search).get('lang') || 'zh').toLowerCase();
const lang = asked.startsWith('zh') ? 'zh' : (L[asked] ? asked : 'zh');
const t = L[lang];
document.documentElement.lang = { en: 'en', zh: 'zh-CN', ja: 'ja', es: 'es' }[lang];
for (const el of document.querySelectorAll('[data-l]')) el.textContent = t[el.dataset.l];

const tb = document.getElementById('tb');
function applyTheme(v) {
  document.documentElement.dataset.theme = v;
  tb.textContent = v === 'dark' ? t.themeLight : t.themeDark;
}
applyTheme(location.search.includes('theme=dark') ? 'dark' : 'light');
tb.onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
// ?shot is for the README's screenshots: the toggle is a way to look at the prototype, not part
// of the surface, and no image of it ships.
if (new URLSearchParams(location.search).has('shot')) tb.remove();
</script>
</body>
</html>
