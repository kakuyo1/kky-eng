<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens · 花费</title>
<style>
:root{
  --bg:#f6f6f8; --panel:#fff; --panel2:#fafafb; --line:#e9e9ee; --line2:#f2f2f5;
  --text:#1a1a1f; --muted:#66666f; --faint:#9d9da8;
  --r-lg:18px;
  --sh2:0 2px 6px rgba(20,20,26,.06),0 24px 60px -24px rgba(20,20,26,.24);
  --f:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
}
html[data-theme=dark]{
  --bg:#131316; --panel:#1c1c20; --panel2:#242429; --line:#2f2f37; --line2:#26262c;
  --text:#e9e9ee; --muted:#a3a3ae; --faint:#75757f;
  --sh2:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);color:var(--text);background:var(--bg);min-height:100vh;display:flex;padding:36px 20px}

.cost{width:280px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh2);padding:18px 20px 16px}
.cs-h{display:flex;align-items:center;font-size:14px;font-weight:650}
.cs-h .hdr-ico{margin-left:auto;display:flex;align-items:center;gap:6px}
.cs-h svg{width:15px;height:15px;color:var(--faint)}

.cs-hero{margin:16px 0 4px}
.cs-hero b{display:block;font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.cs-hero span{font-size:11.5px;color:var(--faint)}

.cs-sep{height:1px;background:var(--line2);margin:14px 0 6px}
.cs-row{display:flex;align-items:center;padding:6px 0;font-size:12.5px;color:var(--muted)}
.cs-row .tokens{margin-left:auto;margin-right:6px;color:var(--faint);font-size:11px;font-family:var(--mono)}
.cs-row b{color:var(--text);font-weight:600;font-family:var(--mono)}

.themebtn{position:fixed;top:14px;right:16px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--f);font-size:11.5px;cursor:pointer}
.themebtn:hover{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="cost">
  <div class="cs-h">花费<span class="hdr-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l14 14M19 5L5 19"/></svg></span></div>

  <div class="cs-hero"><b>¥11.40</b><span>本月花费</span></div>

  <div class="cs-sep"></div>
  <div class="cs-row">今天<span class="tokens">8320 tokens</span><b>¥0.42</b></div>
  <div class="cs-row">昨天<span class="tokens">7040 tokens</span><b>¥0.36</b></div>
  <div class="cs-row">本周<span class="tokens">24160 tokens</span><b>¥2.86</b></div>
  <div class="cs-row">日均<b>¥0.38</b></div>
</div>
<button class="themebtn" id="tb">黑夜</button>
<script>
const tb = document.getElementById('tb');
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  tb.textContent = t === 'dark' ? '白天' : '黑夜';
}
applyTheme(location.search.includes('theme=dark') ? 'dark' : 'light');
tb.onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
</script>
</body>
</html>
