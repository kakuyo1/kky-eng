# The gate that was missing. lens_gtest_unit has been offline, key-free and CI-ready since it was
# written (PHASE1.md section 4.5), but nothing ever ran it -- it held only as long as someone
# remembered to run it by hand.
#
# Five jobs, one concern each, so a red run says what broke instead of naming the one job that
# held everything:
#
#   unit          the offline gtest suite. The cheapest job in the file: it is the only suite
#                 whose build does not pull in the QML module, and the one that runs on every
#                 change (TEST.md section 2).
#   app           the executable compiles and links. main.cpp, the translations and the icon
#                 resources are compiled by no other target, so a break in any of them has no
#                 other job to fail in.
#   qml           the QML module: build it, lint it, then run the component and surface suites
#                 offscreen.
#   coverage-cpp  the C++ line scan, report only.
#   coverage-qml  the QML execution scan, report only.
#
# Every job installs Qt and configures its own tree -- about 45 s of the fixed cost, paid five
# times. That is the price of not shipping a build tree between jobs: a Debug tree with the PDBs
# the coverage tools read is hundreds of megabytes, which costs more to upload and download than
# the rebuild does. .github/actions/configure holds the four steps that would otherwise be five
# copies of the Qt version.
#
# Not here on purpose: lens_gtest_integration needs a real mouse and the real clipboard, and
# lens_gtest_smoke needs a real model and an API key. Both stay human-run; see TEST.md section 2.
# The C++ coverage step inherits that split and runs four of the targets, not five.
#
# The coverage jobs report and do not gate. The numbers still move between runs of an unchanged
# tree -- the QML trace's event counts vary from run to run, and each scan is over whatever
# targets a machine can run, which is not the same set here as on a development box -- so a
# threshold would fail on the weather. TEST.md section 4 carries the scope of both scans.
# (The one that used to swing the C++ total, a known-red case in lens_gtest_integration, was
# fixed on 2026-10-05; that wobble is gone, but the two above are not.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: windows-latest

    steps:
      # v5 is the release whose whole content is "run under node 24", which is what the
      # deprecation notice asks for. v6 and v7 exist but change things this job does not use --
      # where the checkout keeps git credentials, and which refs a pull_request_target may check
      # out -- so this is as far as it needs to go; v5 wants runner 2.327.1, which the hosted
      # images are.
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # Only lens_core and lens_llm, so no QML module and no QML ahead-of-time compilation
      # figures in this job at all.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_gtest_unit

      - name: Unit tests
        run: ./build-ninja/test/googletest/lens_gtest_unit.exe
        env:
          QT_FORCE_STDERR_LOGGING: 1

  app:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # The shipped executable and nothing else. It links lens_app, so this is also where the QML
      # module and src/app's own sources are compiled; the suites below each build what they need
      # and would not notice a break outside their own link line.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens

  qml:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # The two QTest targets are the whole QML side, and they need the module the lint below
      # reads through.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_qtest_components lens_qtest_surfaces

      # After the build, never before it: qmllint resolves the module's own types through the
      # build tree's copies of the .qml files, so a tree that has not been built is judged from
      # files that are not there. scripts/quality/qml-lint.sh owns the reasoning and the ratchet, and
      # expects a configured tree -- which the configure action has just made.
      - name: QML lint
        run: bash scripts/quality/qml-lint.sh
        shell: bash

      # QT_QPA_PLATFORM=offscreen is what makes these two headless -- they build real windows,
      # and offscreen is the platform that gives them one without a screen. On a runner there is
      # a console, so QT_FORCE_STDERR_LOGGING is belt and braces here rather than the necessity
      # it is on the development machine; it is set so a failure reads the same in both places,
      # which is the command TEST.md section 2 documents.
      - name: Component tests
        run: ./build-ninja/test/qtest/lens_qtest_components.exe
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1

      - name: Surface tests
        run: ./build-ninja/test/qtest/lens_qtest_surfaces.exe
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1

  coverage-cpp:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # The four targets a runner can run, which is what the scan below is handed. lens is not
      # among them: it is covered by nothing and would only be built for its own PDB.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_gtest_unit lens_gtest_perf lens_qtest_components lens_qtest_surfaces

      # The image carries neither of the two coverage tools. OpenCppCoverage ships as one
      # executable that reads a binary's PDB, so installing it is the whole setup; the version is
      # pinned the way Qt's is, and TEST.md section 4 has the same line for a dev machine.
      - name: Install OpenCppCoverage
        run: |
          $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\OpenCppCoverageSetup.exe"
          Start-Process -FilePath "$env:TEMP\OpenCppCoverageSetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
        shell: pwsh

      # lens_gtest_integration is left out even though the script's default includes it: it
      # drives the real mouse and the real clipboard.
      - name: Coverage (C++)
        run: bash scripts/quality/coverage.sh test/records/coverage lens_gtest_unit lens_gtest_perf lens_qtest_components lens_qtest_surfaces
        shell: bash

      # always(), because a red case is exactly when the report is worth reading. The file is the
      # raw data behind the report under docs/metrics/.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp
          path: test/records/coverage/coverage.xml

  coverage-qml:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/configure

      # qmlprofiler launches the two QTest binaries itself, so this is the same pair of suites
      # the qml job runs -- measured instead of just checked.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens_qtest_components lens_qtest_surfaces

      # tree-sitter, for the parse tree the QML scan counts its denominator from. It is the same
      # dependency the AST metrics use, so this is the one install both share.
      #
      # The grammar has no prebuilt binary for this platform, so npm builds it with node-gyp
      # instead of downloading one -- and the runner's default Visual Studio is now 2026, which
      # installs as 18.x. node-gyp could not read an 18.x version string until 12.1.0: before
      # that it reports "unknown version undefined", then "could not find any Visual Studio
      # installation to use", and stops, which reads like a missing install and is not one.
      # npm 11.6.3 is the first that bundles node-gyp 12.1, and the runner is on npm 10, so
      # moving npm is what fixes it. Pinning the job to windows-2022 would also work and was the
      # wrong direction: it buys a compiler the image is retiring rather than a tool that can
      # read the one it ships.
      #
      # It is also the longest step in the file, which is why it is in this job and not in the
      # one above: the two scans share no tool, and running them in parallel keeps the 80 s of
      # node-gyp off the C++ numbers' critical path.
      - name: Install QML metric dependencies
        run: |
          npm install -g "npm@^11.6.3"
          npm ci

      - name: Coverage (QML)
        run: bash scripts/quality/qml-coverage.sh
        shell: bash

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-qml
          path: test/records/qmlcov/qml-coverage.json
