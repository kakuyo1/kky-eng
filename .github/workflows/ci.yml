# The gate that was missing. lens_gtest_unit has been offline, key-free and CI-ready since it
# was written (PHASE1.md section 4.5), but nothing ever ran it -- it held only as long as
# someone remembered to run it by hand. This is deliberately the smallest pipeline that closes
# that gap.
#
# The two QTest targets belong here for the same reason, and needed nothing new to get in: they
# want a QGuiApplication and a Qt Quick scene, not a screen, so QT_QPA_PLATFORM=offscreen puts
# the whole QML side -- components and surfaces -- inside a key-free job. What each of them
# covers, and the several ways a QTest harness goes quiet rather than red, are TEST.md section 2.
#
# Not here on purpose: lens_gtest_integration needs a real mouse and the real clipboard, and
# lens_gtest_smoke needs a real model and an API key. Both stay human-run; see TEST.md section 2.
# The coverage steps below inherit that split and run four of the targets, not five.
#
# The coverage steps report and do not gate. The numbers move on their own between runs of an
# unchanged tree -- one known-red case in lens_gtest_integration leaves lines covered or not
# depending on how the timing falls, which is worth about a percentage point on the total -- so
# a threshold would fail on the weather. TEST.md section 4 carries the scope of both scans.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: windows-latest

    steps:
      # v5 is the release whose whole content is "run under node 24", which is what the
      # deprecation notice asks for. v6 and v7 exist but change things this job does not use --
      # where the checkout keeps git credentials, and which refs a pull_request_target may
      # check out -- so this is as far as it needs to go; v5 wants runner 2.327.1, which the
      # hosted images are.
      - uses: actions/checkout@v5

      # The base install carries every component the configure step asks for: qtbase (Core,
      # Gui, Widgets, Network, and Test, which is where Qt6Test comes from), qtdeclarative
      # (Quick, and QuickTest, which is built out of its src/qmltest), qtsvg, qttools
      # (LinguistTools). It also puts Qt's bin on PATH, which is what the test executables need
      # for the Qt DLLs.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: win64_msvc2022_64
          cache: true

      # Ninja cannot find MSVC by itself -- the same reason scripts/build.bat enters the Visual
      # Studio environment before driving CMake. The runner has VS 2022, so nothing installs.
      - uses: ilammy/msvc-dev-cmd@v1

      # The preset bakes in this machine's Qt (B:/qtt/6.9.0/msvc2022_64). Override it with
      # wherever the action put Qt; the rest of the preset is meant to be used as written.
      - name: Configure
        run: cmake --preset ninja-qt6 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # lens is built alongside the tests so a compile error in src/app fails the gate too --
      # lens_gtest_unit links only lens_core and lens_llm, and would not notice. The QTest
      # targets are named for the same reason: qmllint reads the module's QML, not the C++ the
      # surfaces are driven by, and neither step would touch a new .cpp on its own.
      - name: Build
        run: cmake --build --preset ninja-qt6 --target lens lens_gtest_unit lens_gtest_perf lens_qtest_components lens_qtest_surfaces

      # Rides on the tree the configure step just wrote: scripts/qml-lint.sh reads the qmllint
      # response file CMake leaves there and takes qmllint from the Qt that file names.
      - name: QML lint
        run: bash scripts/qml-lint.sh
        shell: bash

      - name: Unit tests
        run: ./build-ninja/test/googletest/lens_gtest_unit.exe
        env:
          QT_FORCE_STDERR_LOGGING: 1

      # QT_QPA_PLATFORM=offscreen is what makes these two headless -- they build real windows,
      # and offscreen is the platform that gives them one without a screen. On a runner there
      # is a console, so QT_FORCE_STDERR_LOGGING is belt and braces here rather than the
      # necessity it is on the development machine; it is set so a failure reads the same in
      # both places, which is the command TEST.md section 2 documents.
      - name: Component tests
        run: ./build-ninja/test/qtest/lens_qtest_components.exe
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1

      - name: Surface tests
        run: ./build-ninja/test/qtest/lens_qtest_surfaces.exe
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1

      # The image carries neither of the two coverage tools. OpenCppCoverage ships as one
      # executable that reads a binary's PDB, so installing it is the whole setup; the version
      # is pinned the way Qt's is, and TEST.md section 4 has the same line for a dev machine.
      - name: Install OpenCppCoverage
        run: |
          $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\OpenCppCoverageSetup.exe"
          Start-Process -FilePath "$env:TEMP\OpenCppCoverageSetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
        shell: pwsh

      # The four targets a runner can run. lens_gtest_integration is left out here even though
      # the script's default includes it: it drives the real mouse and clipboard.
      - name: Coverage (C++)
        run: bash scripts/coverage.sh test/records/coverage lens_gtest_unit lens_gtest_perf lens_qtest_components lens_qtest_surfaces
        shell: bash

      # tree-sitter, for the parse tree the QML scan counts its denominator from. It is the
      # same dependency the AST metrics use, so this is the one install both share.
      #
      # The grammar has no prebuilt binary for this platform, so npm builds it with node-gyp,
      # and that is what the pin below is for. ilammy/msvc-dev-cmd picked the newest Visual
      # Studio on the image, 2026 (18.x), and npm's bundled node-gyp cannot read an 18.x
      # version string -- it reports "unknown version undefined" and gives up with "could not
      # find any Visual Studio installation to use", which reads like a missing install and is
      # not one. The image also carries VS 2022 (17.14), which this node-gyp does know, so
      # naming it settles the choice.
      - name: Install QML metric dependencies
        run: |
          npm config set msvs_version 2022
          npm ci

      # qmlprofiler comes from the Qt the action installed, already on PATH. It launches the
      # two QTest binaries itself, so this is the same pair of suites the steps above ran,
      # measured instead of just checked.
      - name: Coverage (QML)
        run: bash scripts/qml-coverage.sh
        shell: bash

      # always(), because a red case is exactly when the report is worth reading. The two files
      # are the raw data behind the report under docs/metrics/.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            test/records/coverage/coverage.xml
            test/records/qmlcov/qml-coverage.json
